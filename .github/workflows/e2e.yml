name: E2E tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Unity Ads plugin is a private repo pinned over SSH, which the default token cannot read.
      - name: Authorise private dependency
        env:
          TOKEN: ${{ secrets.UNITY_ADS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a UNITY_ADS_REPO_TOKEN secret with read access to Polite-Carrot/polite-carrot-unity-ads."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"

      - run: npm ci

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
